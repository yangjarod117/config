ipv6: false
vif_only: true
block_quic: true
hijack_dns:
  - '*:53'
geoip_db_url: https://raw.githubusercontent.com/Masaiki/GeoIP2-CN/release/Country.mmdb
asn_db_url: https://raw.githubusercontent.com/P3TERX/GeoLite.mmdb/download/GeoLite2-ASN.mmdb
proxy_latency_test_url: http://www.gstatic.com/generate_204
direct_latency_test_url: http://wifi.vivo.com.cn/generate_204
close_connections_on_policy_change: true
real_ip_domains:
  - '*.push.apple.com'
default_subscription_group: 我的订阅
default_proxy_group: 我的订阅

dns:
  bootstrap:
    - system
    - 223.5.5.5
    - 119.29.29.29
  upstreams:
    国内:
      - system
      - https://dns.alidns.com/dns-query
      - https://doh.pub/dns-query
    国外:
      - https://1.1.1.1/dns-query
      - https://8.8.8.8/dns-query
  forward:
    - proxy_rule_set:
        match: https://raw.githubusercontent.com/yangjarod117/config/main/rules/YouTubeMusic.yaml
        value: 国外
    - proxy_rule_set:
        match: https://raw.githubusercontent.com/yangjarod117/config/main/rules/YouTube.yaml
        value: 国外
    - proxy_rule_set:
        match: https://raw.githubusercontent.com/yangjarod117/config/main/rules/Telegram.yaml
        value: 国外
    - proxy_rule_set:
        match: https://raw.githubusercontent.com/yangjarod117/config/main/rules/Global.yaml
        value: 国外
    - domain_wildcard:
        match: '*'
        value: 国内
  proxy_nameservers:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query

policy_groups:
  - select:
      name: 我的订阅
      policies:
        - DIRECT
      icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Airport.png
  - select:
      name: 美国
      policies:
        - 我的订阅
      flatten: true
      filter: '(?i)(美国|🇺🇸|(^|[^a-z])us)'
      icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/United_States.png
  - select:
      name: 日本
      policies:
        - 我的订阅
      flatten: true
      filter: '(?i)(日本|🇯🇵|(^|[^a-z])jp)'
      icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Japan.png
  - select:
      name: Global
      policies:
        - 美国
        - 日本
        - 我的订阅
      icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Global.png
  - select:
      name: YouTube
      policies:
        - 美国
        - 日本
        - 我的订阅
      block_quic: false
      icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/YouTube.png
  - select:
      name: Telegram
      policies:
        - 美国
        - 日本
        - 我的订阅
      icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Telegram.png
  - select:
      name: Apple
      policies:
        - DIRECT
        - 美国
        - 日本
        - 我的订阅
      icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Apple.png

rules:
  - rule_set:
      match: https://raw.githubusercontent.com/yangjarod117/config/main/rules/Lan.yaml
      policy: DIRECT
  - rule_set:
      match: https://raw.githubusercontent.com/yangjarod117/config/main/rules/ModuleReject.yaml
      policy: REJECT
  - rule_set:
      match: https://raw.githubusercontent.com/yangjarod117/config/main/rules/Hijacking.yaml
      policy: REJECT
  - rule_set:
      match: https://raw.githubusercontent.com/yangjarod117/config/main/rules/AdvertisingLite.yaml
      policy: REJECT
  - rule_set:
      match: https://raw.githubusercontent.com/yangjarod117/config/main/rules/Privacy.yaml
      policy: REJECT
  - rule_set:
      match: https://raw.githubusercontent.com/yangjarod117/config/main/rules/iCloud.yaml
      policy: DIRECT
  - rule_set:
      match: https://raw.githubusercontent.com/yangjarod117/config/main/rules/YouTubeMusic.yaml
      policy: YouTube
  - rule_set:
      match: https://raw.githubusercontent.com/yangjarod117/config/main/rules/YouTube.yaml
      policy: YouTube
  - rule_set:
      match: https://raw.githubusercontent.com/yangjarod117/config/main/rules/Telegram.yaml
      policy: Telegram
  - rule_set:
      match: https://raw.githubusercontent.com/yangjarod117/config/main/rules/Apple.yaml
      policy: Apple
  - rule_set:
      match: https://raw.githubusercontent.com/yangjarod117/config/main/rules/China.yaml
      policy: DIRECT
  - rule_set:
      match: https://raw.githubusercontent.com/yangjarod117/config/main/rules/Global.yaml
      policy: Global
  - rule_set:
      match: https://raw.githubusercontent.com/yangjarod117/config/main/rules/ChinaIPs.yaml
      policy: DIRECT
  - geoip:
      match: CN
      policy: DIRECT
  - default:
      policy: Global

mitm:
  ca_p12: egern.p12
  ca_passphrase: egern

modules:
  - name: 广告拦截&净化合集
    url: https://raw.githubusercontent.com/fmz200/wool_scripts/main/Surge/module/blockAds.module
  - name: HTTPDNS拦截器
    url: https://raw.githubusercontent.com/fmz200/wool_scripts/main/Surge/module/blockHTTPDNS.module
