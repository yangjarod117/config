[general]
network_check_url = http://wifi.vivo.com.cn/generate_204
server_check_url = http://www.gstatic.com/generate_204
server_check_timeout = 5000
dns_exclusion_list = *.push.apple.com, *.cmpassport.com, id6.me, open.e.189.cn, opencloud.wostore.cn, mdn.open.wo.cn, auth.wosms.cn, *.10099.com.cn, *.jegotrip.com.cn, *.icitymobile.mobi, *.pingan.com.cn, *.cmbchina.com
excluded_routes = 239.255.255.250/32
udp_whitelist = 1-442, 444-65535
fallback_udp_policy = reject

[dns]
no-ipv6
server = 223.5.5.5
server = 119.29.29.29

[policy]
static = 我的订阅, resource-tag-regex=^我的订阅$, server-tag-regex=., img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Airport.png
static = 美国, resource-tag-regex=^我的订阅$, server-tag-regex=(?i)(美国|🇺🇸|(^|[^a-z])us), img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/United_States.png
static = 日本, resource-tag-regex=^我的订阅$, server-tag-regex=(?i)(日本|🇯🇵|(^|[^a-z])jp), img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Japan.png
static = YouTube, 美国, 日本, 我的订阅, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/YouTube.png
static = Telegram, 美国, 日本, 我的订阅, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Telegram.png
static = AI, 美国, 日本, 我的订阅, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/AI.png
static = Google, 美国, 日本, 我的订阅, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Google_Search.png
static = Apple, direct, 美国, 日本, 我的订阅, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Apple.png
static = Global, 美国, 日本, 我的订阅, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Global.png

