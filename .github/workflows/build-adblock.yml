name: build-adblock
on:
  schedule:
    - cron: "0 18 * * 0"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - run: python scripts/build_adblock.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add surge/adblock.sgmodule egern/adblock.yaml loon/adblock.lpx qx/adblock.snippet
          git diff --cached --quiet || git commit -m "更新去广告合集 $(date -u +%F)"
          git pull --rebase
          git push
