name: sync-rules

on:
  schedule:
    - cron: "30 20 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Install sing-box
        run: |
          tag=$(curl -fsSL https://api.github.com/repos/SagerNet/sing-box/releases/latest | python3 -c 'import json,sys; print(json.load(sys.stdin)["tag_name"])')
          curl -fsSL "https://github.com/SagerNet/sing-box/releases/download/$tag/sing-box-${tag#v}-linux-amd64.tar.gz" | tar xz -C "$RUNNER_TEMP"
          echo "SING_BOX=$RUNNER_TEMP/sing-box-${tag#v}-linux-amd64/sing-box" >> "$GITHUB_ENV"
      - run: python scripts/sync_rules.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add egern/rules surge/rules qx/rules loon/rules singbox/rules
          git diff --cached --quiet || git commit -m "更新规则 $(date -u +%F)"
          git push
