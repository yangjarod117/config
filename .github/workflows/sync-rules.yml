name: sync-rules

on:
  schedule:
    # UTC 17:00，北京时间凌晨 1:00
    - cron: "0 17 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Install sing-box
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo SagerNet/sing-box --pattern 'sing-box-*-linux-amd64.tar.gz' --dir "$RUNNER_TEMP"
          tar xzf "$RUNNER_TEMP"/sing-box-*-linux-amd64.tar.gz -C "$RUNNER_TEMP"
          bin=$(echo "$RUNNER_TEMP"/sing-box-*-linux-amd64/sing-box)
          "$bin" version
          echo "SING_BOX=$bin" >> "$GITHUB_ENV"
      - run: python scripts/sync_rules.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add egern/rules surge/rules qx/rules loon/rules singbox/rules
          git diff --cached --quiet || git commit -m "更新规则 $(date -u +%F)"
          git push
